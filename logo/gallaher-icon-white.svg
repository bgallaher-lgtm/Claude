<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Gallaher Computers</title>
<g transform="translate(0,0) scale(1.0)">
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#FFFFFF"/>
  <!-- arc of the G: from upper-right, round the left, back to the right -->
  <path d="M 125.36 45.62 A 60 60 0 1 0 160 100" fill="none" stroke="#0E6B2A" stroke-width="24" stroke-linecap="butt"/>
  <!-- arrowhead on the open end (recycling motion) -->
  <path d="M 112.7 72.8 L 138.1 18.4 L 167.1 65.1 Z" fill="#0E6B2A" stroke="#0E6B2A" stroke-width="4" stroke-linejoin="round"/>
  <!-- crossbar as a circuit trace ending in a node -->
  <rect x="104" y="88" width="68" height="24" fill="#4CB848"/>
  <circle cx="100" cy="100" r="19" fill="#4CB848"/>
  <circle cx="100" cy="100" r="8" fill="#FFFFFF"/>
</g>
</svg>
